name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos que pide el deploy oficial de Pages: leer el repo, publicar el
# artifact y firmar el despliegue.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez. No cancela el que está en vuelo: que termine de publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Las mismas puertas que se corren en local: si tsc o el linter fallan,
      # no se publica. `npm run build` ya incluye `tsc -b`.
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
